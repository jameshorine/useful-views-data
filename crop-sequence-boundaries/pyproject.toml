[project]
name = "crop-sequence-boundaries"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jameshorine" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.4.5",
    "polars>=1.36.1",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
]

[project.scripts]
crop-sequence-boundaries = "crop_sequence_boundaries:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]
