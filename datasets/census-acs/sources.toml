access = """
Download from https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/:
one pipe-delimited file per table (data/5YRData/acsdt5y2024-<table>.dat), and the
geography file and table shells (documentation/). No key or login is needed.
fetch_raw.py downloads them and checks each file's SHA-256 against SOURCES.md, and
each recipe checks the files it reads again before reading them."""
