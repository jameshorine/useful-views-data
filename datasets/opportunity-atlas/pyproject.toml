[project]
name = "opportunity-atlas"
version = "0.1.0"
description = "Useful views on The Opportunity Atlas (Opportunity Insights): children's outcomes in adulthood by the tract, county and commuting zone where they grew up, built with useful-views."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.1.31",
    "duckdb>=2.0.1",
    "useful-views>=0.3.0",
]
