[project]
name = "fas-psd"
version = "0.1.0"
description = "Tidy, documented views on USDA FAS Production, Supply and Distribution (PSD)."
readme = "README.md"
authors = [
    { name = "jameshorine" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.5",
    "polars>=1.36.1",
    "pyarrow>=21.0.0",
]

[project.scripts]
fas-psd = "fas_psd:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pytest>=8.4.2",
]
